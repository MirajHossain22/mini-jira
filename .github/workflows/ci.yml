name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore TaskTracker.sln
      - run: dotnet build TaskTracker.sln --configuration Release --no-restore
      - run: dotnet test TaskTracker.sln --configuration Release --no-build --verbosity normal
